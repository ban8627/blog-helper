<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>블로그 글자수 세기 · 하루 한 칸</title>
  <meta name="description" content="블로그 글을 붙여 넣으면 공백 포함·공백 제외 글자 수와 목표까지 남은 글자 수를 바로 보여 줍니다. 입력한 글은 저장하거나 전송하지 않습니다.">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <p class="brand">하루 한 칸</p>
    <h1>블로그 글자수 세기</h1>
    <p class="lead">글을 붙여 넣으면 바로 셉니다. 입력한 글은 서버로 보내거나 저장하지 않으며, 새로고침하면 사라집니다.</p>
  </header>

  <main class="layout">
    <section class="editor" aria-labelledby="text-label">
      <div class="editor-head">
        <label id="text-label" for="text">글 내용</label>
        <button type="button" id="clear" class="ghost">지우기</button>
      </div>
      <textarea id="text" spellcheck="false" placeholder="여기에 블로그 글을 붙여 넣거나 입력해 보세요."></textarea>
      <p class="note">줄바꿈은 세지 않습니다. 공백 제외에서는 띄어쓰기·탭·줄바꿈 없는 공백(NBSP)을 모두 뺍니다. 👍🏻 같은 이모지는 1자로 셉니다.</p>
    </section>

    <aside class="panel" aria-label="글자 수 결과">
      <div class="stats" aria-live="polite">
        <div class="stat main">
          <span class="label">공백 제외</span>
          <strong id="without">0</strong><span class="unit">자</span>
        </div>
        <div class="stat main">
          <span class="label">공백 포함</span>
          <strong id="with">0</strong><span class="unit">자</span>
        </div>
        <div class="stat">
          <span class="label">단어</span>
          <strong id="words">0</strong><span class="unit">개</span>
        </div>
        <div class="stat">
          <span class="label">내용이 있는 줄</span>
          <strong id="lines">0</strong><span class="unit">줄</span>
        </div>
      </div>

      <fieldset class="goal">
        <legend>목표 글자 수</legend>
        <div class="presets" role="group" aria-label="목표 빠르게 고르기">
          <button type="button" data-goal="1000">1,000</button>
          <button type="button" data-goal="1500">1,500</button>
          <button type="button" data-goal="2000">2,000</button>
          <button type="button" data-goal="3000">3,000</button>
        </div>
        <div class="goal-row">
          <label for="goal">직접 입력</label>
          <input id="goal" type="text" inputmode="numeric" value="3,000" autocomplete="off" aria-describedby="goal-error">
          <span>자</span>
        </div>
        <div class="basis" role="radiogroup" aria-label="목표 기준">
          <label><input type="radio" name="basis" value="without" checked> 공백 제외 기준</label>
          <label><input type="radio" name="basis" value="with"> 공백 포함 기준</label>
        </div>
        <p id="goal-error" class="error" role="alert" hidden></p>
        <div id="progress-box">
          <div class="bar" role="progressbar" aria-label="목표 진행률" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
            <span id="bar-fill"></span>
          </div>
          <p id="progress-text" class="progress-text">목표까지 3,000자 남았습니다.</p>
        </div>
      </fieldset>

      <div class="copy">
        <button type="button" id="copy">결과 복사</button>
        <p id="copy-status" class="copy-status" aria-live="polite"></p>
        <div id="manual" hidden>
          <label for="manual-text">자동 복사가 되지 않았습니다. 아래 내용을 직접 선택해 복사해 주세요.</label>
          <input id="manual-text" type="text" readonly>
        </div>
      </div>
    </aside>
  </main>

  <footer class="foot">
    <p>바이브 코딩으로 만든 작은 도구입니다. 결과는 이 도구의 세는 방식 기준이며, 사이트마다 세는 방식이 다를 수 있습니다.</p>
  </footer>

  <script src="counter.js"></script>
  <script src="app.js"></script>
</body>
</html>
